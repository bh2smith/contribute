name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify single-file deliverable
        run: |
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: contribute-html
          path: dist/index.html
          if-no-files-found: error
      - name: Build sandbox catalog
        run: bun run build:sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: contribute-sandbox-html
          path: dist/index.html
          if-no-files-found: error
      - name: Build consumer preview
        run: bun run build:nms-preview
      - uses: actions/upload-artifact@v4
        with:
          name: contribute-nms-preview-html
          path: dist/index.html
          if-no-files-found: error
